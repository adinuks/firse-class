<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      text-align: center;
    }
    h1 {
      font-size: 6rem;
      line-height: 1.1;
    }
    .avatar {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 1.5rem;
      border: 3px solid #fff;
    }
    .linkedin {
      margin-top: 1.5rem;
      display: inline-flex;
      color: #bbb;
      transition: color 0.2s;
    }
    .linkedin:hover, .linkedin:focus-visible { color: #0a66c2; }
    .linkedin svg { width: 48px; height: 48px; fill: currentColor; }
    #datetime {
      margin-top: 1.5rem;
      font-size: 1.5rem;
      color: #bbb;
    }
    @media (max-width: 600px) {
      h1 { font-size: 3rem; }
      #datetime { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <img class="avatar" src="profile.jpg" alt="Aditya's profile picture">
  <h1>Hello from Aditya</h1>
  <p id="datetime"></p>
  <a class="linkedin" href="https://www.linkedin.com/in/anukala/" target="_blank" rel="noopener noreferrer" aria-label="Aditya on LinkedIn">
    <svg viewBox="0 0 24 24" role="img" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 1 1 0-4.125 2.062 2.062 0 0 1 0 4.125zM7.119 20.452H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
  </a>

  <script>
    function updateDateTime() {
      const now = new Date();
      const date = now.toLocaleDateString('en-GB', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      });
      const time = now.toLocaleTimeString('en-US', {
        hour: 'numeric', minute: '2-digit', hour12: true
      });
      document.getElementById('datetime').textContent = date + ' · ' + time;
    }
    updateDateTime();
    setInterval(updateDateTime, 1000);
  </script>
</body>
</html>
